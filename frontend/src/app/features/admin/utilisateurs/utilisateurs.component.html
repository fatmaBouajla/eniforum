<app-layout title="Utilisateurs" subtitle="Comptes, rôles et accès à la plateforme">
  <div class="alert alert-error" *ngIf="erreur"><lucide-icon name="circle-alert" [size]="18"></lucide-icon>{{ erreur }}</div>

  <div class="toolbar">
    <div class="search input-icon">
      <lucide-icon name="search" [size]="16"></lucide-icon>
      <input class="input" type="search" placeholder="Rechercher par nom ou email" [(ngModel)]="recherche" aria-label="Rechercher">
    </div>
    <span class="spacer"></span>
    <button class="btn btn-primary" (click)="ouvrir(null)"><lucide-icon name="user-plus" [size]="16"></lucide-icon> Nouvel utilisateur</button>
  </div>

  <div class="segmented" style="margin-bottom:16px">
    <button class="seg-btn" [class.active]="!filtreRole" (click)="filtreRole = ''">Tous <span class="count">{{ nombre('') }}</span></button>
    <button class="seg-btn" *ngFor="let r of roles" [class.active]="filtreRole === r.value" (click)="filtreRole = r.value">
      {{ r.label }} <span class="count">{{ nombre(r.value) }}</span>
    </button>
  </div>

  <div class="card">
    <div class="skeleton" style="height:260px;margin:16px" *ngIf="loading"></div>
    <div class="table-wrap" *ngIf="!loading && filtres.length">
      <table class="table">
        <thead><tr><th>Utilisateur</th><th>Rôle</th><th>Statut</th><th class="actions">Actions</th></tr></thead>
        <tbody>
          <tr *ngFor="let u of filtres">
            <td>
              <div class="cell-user">
                <span class="avatar">{{ initiales(u.nom) }}</span>
                <span class="truncate"><span class="name">{{ u.nom }}</span><br><span class="sub">{{ u.email }}</span></span>
              </div>
            </td>
            <td><app-statut-badge [statut]="u.role"></app-statut-badge></td>
            <td>
              <span class="badge" [ngClass]="u.actif ? 'badge-green' : ''">
                <span class="dot" [class.green]="u.actif" [style.background]="u.actif ? null : '#9AA8BA'"></span>{{ u.actif ? 'Actif' : 'Désactivé' }}
              </span>
            </td>
            <td class="actions">
              <button class="icon-btn" title="Modifier" (click)="ouvrir(u)"><lucide-icon name="pencil" [size]="16"></lucide-icon></button>
              <ng-container *ngIf="u.email !== monEmail">
                <button class="icon-btn" [title]="u.actif ? 'Désactiver le compte' : 'Réactiver le compte'" (click)="basculerActif(u)">
                  <lucide-icon [name]="u.actif ? 'lock' : 'lock-open'" [size]="16"></lucide-icon>
                </button>
                <button class="icon-btn danger" title="Supprimer" (click)="aSupprimer = u"><lucide-icon name="trash-2" [size]="16"></lucide-icon></button>
              </ng-container>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <app-empty *ngIf="!loading && !filtres.length" icon="users" title="Aucun utilisateur trouvé" text="Modifiez la recherche ou le filtre de rôle."></app-empty>
  </div>

  <!-- Création / modification -->
  <app-modal [open]="modalOuvert" [title]="edition ? 'Modifier l’utilisateur' : 'Nouvel utilisateur'" (close)="modalOuvert = false">
    <form [formGroup]="form" class="form-grid" (ngSubmit)="enregistrer()" id="formUser">
      <div class="field full">
        <label for="u-nom">Nom complet <span class="req">*</span></label>
        <input id="u-nom" class="input" formControlName="nom">
        <span class="field-error" *ngIf="f['nom'].touched && f['nom'].invalid">Nom requis</span>
      </div>
      <div class="field full">
        <label for="u-email">Email <span class="req">*</span></label>
        <input id="u-email" class="input" type="email" formControlName="email">
        <span class="field-error" *ngIf="f['email'].touched && f['email'].invalid">Email invalide</span>
      </div>
      <div class="field">
        <label for="u-role">Rôle <span class="req">*</span></label>
        <select id="u-role" class="select" formControlName="role">
          <option *ngFor="let r of roles" [value]="r.value">{{ r.label }}</option>
        </select>
      </div>
      <div class="field">
        <label for="u-mdp">Mot de passe <span class="req" *ngIf="!edition">*</span></label>
        <input id="u-mdp" class="input" type="password" formControlName="motDePasse" autocomplete="new-password"
               [placeholder]="edition ? 'Laisser vide pour ne pas changer' : ''">
        <span class="field-error" *ngIf="f['motDePasse'].touched && f['motDePasse'].invalid">8 caractères minimum</span>
      </div>
      <div class="alert alert-error full" *ngIf="erreurForm"><lucide-icon name="circle-alert" [size]="18"></lucide-icon>{{ erreurForm }}</div>
    </form>
    <div modal-footer>
      <button class="btn btn-secondary" (click)="modalOuvert = false">Annuler</button>
      <button class="btn btn-primary" type="submit" form="formUser" [disabled]="enregistrement">
        {{ edition ? 'Enregistrer' : 'Créer le compte' }}
      </button>
    </div>
  </app-modal>

  <app-confirm-modal [open]="!!aSupprimer" title="Supprimer cet utilisateur ?" icon="trash-2" [danger]="true" confirmLabel="Supprimer"
    [message]="'Le compte de ' + (aSupprimer?.nom || '') + ' sera définitivement supprimé. Pour garder son historique, désactivez plutôt le compte.'"
    (confirm)="supprimer()" (cancel)="aSupprimer = null"></app-confirm-modal>
</app-layout>

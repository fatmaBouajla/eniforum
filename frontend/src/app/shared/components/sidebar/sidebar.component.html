<aside class="sidebar" [class.collapsed]="ui.collapsed" [class.mobile-open]="ui.mobileNavOpen" aria-label="Navigation principale">
  <a class="brand" routerLink="/" title="Accueil EniForum">
    <img src="assets/logo-forum.png" alt="Forum Entreprises ENICarthage" class="brand-logo">
    <div class="brand-text">
      <span class="brand-name">EniForum</span>
      <span class="brand-sub">Forum Entreprises</span>
    </div>
  </a>

  <div class="nav-label">Navigation</div>
  <nav class="nav">
    <a class="nav-item" *ngFor="let item of navItems" [routerLink]="item.route"
       [class.active]="isActive(item.route)" [attr.aria-current]="isActive(item.route) ? 'page' : null"
       [title]="ui.collapsed ? item.label : ''" (click)="ui.closeMobileNav()">
      <lucide-icon [name]="item.icon" [size]="18"></lucide-icon>
      <span class="label">{{ item.label }}</span>
      <span class="count" *ngIf="item.badge">{{ item.badge }}</span>
    </a>
  </nav>

  <div class="bottom">
    <a class="nav-item" routerLink="/profil" [class.active]="isActive('/profil')" [title]="ui.collapsed ? 'Mon profil' : ''" (click)="ui.closeMobileNav()">
      <lucide-icon name="user" [size]="18"></lucide-icon><span class="label">Mon profil</span>
    </a>
    <button class="nav-item logout" (click)="logout()" [title]="ui.collapsed ? 'Déconnexion' : ''">
      <lucide-icon name="log-out" [size]="18"></lucide-icon><span class="label">Déconnexion</span>
    </button>
    <div class="me">
      <div class="avatar sm">{{ initials }}</div>
      <div class="me-txt">
        <div class="me-name truncate">{{ user?.nom }}</div>
        <div class="me-role">{{ roleLabel }}</div>
      </div>
      <button class="icon-btn collapse" (click)="ui.toggleCollapsed()" [attr.aria-label]="ui.collapsed ? 'Déplier le menu' : 'Réduire le menu'">
        <lucide-icon [name]="ui.collapsed ? 'panel-left-open' : 'panel-left-close'" [size]="16"></lucide-icon>
      </button>
    </div>
  </div>
</aside>

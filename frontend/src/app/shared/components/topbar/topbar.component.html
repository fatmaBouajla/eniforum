<header class="topbar">
  <button class="icon-btn menu-btn" (click)="ui.toggleMobileNav()" aria-label="Ouvrir le menu">
    <lucide-icon name="menu" [size]="20"></lucide-icon>
  </button>

  <div class="titles">
    <h1>{{ title }}</h1>
    <p *ngIf="subtitle">{{ subtitle }}</p>
  </div>

  <div class="right">
    <div class="notif-wrap">
      <button class="icon-btn bell" (click)="toggleNotifs($event)" aria-label="Notifications" [attr.aria-expanded]="showNotifs">
        <lucide-icon name="bell" [size]="19"></lucide-icon>
        <span class="pip" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </button>
      <div class="panel" *ngIf="showNotifs" (click)="$event.stopPropagation()">
        <div class="panel-head">
          <span>Notifications</span>
          <button class="btn btn-ghost btn-sm" *ngIf="unreadCount > 0" (click)="markAllRead()">Tout marquer comme lu</button>
        </div>
        <div class="panel-empty" *ngIf="notifications.length === 0">
          <lucide-icon name="circle-check" [size]="22"></lucide-icon>
          <span>Vous êtes à jour</span>
        </div>
        <button class="notif" *ngFor="let n of notifications" (click)="markRead(n.id)">
          <span class="n-ico"><lucide-icon [name]="typeIcon(n.type)" [size]="16"></lucide-icon></span>
          <span class="n-body">
            <span class="n-msg">{{ n.message }}</span>
            <span class="n-date">{{ n.dateEnvoi | date:'dd/MM à HH:mm' }}</span>
          </span>
        </button>
      </div>
    </div>
    <a class="avatar" routerLink="/profil" [title]="auth.currentUser?.nom ?? ''">{{ userInitials }}</a>
  </div>
</header>

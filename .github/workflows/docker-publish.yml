# Construit et publie les 3 images sur Docker Hub.
#   - push sur main      -> tags "latest" et "sha-xxxxxxx"
#   - tag git v1.2.3     -> tags "1.2.3", "1.2" et "latest"
# Prérequis (une seule fois) : GitHub > Settings > Secrets and variables > Actions
#   DOCKERHUB_USERNAME = votre identifiant Docker Hub
#   DOCKERHUB_TOKEN    = jeton d'accès Docker Hub (Account settings > Personal access tokens)
name: Publication Docker Hub

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-ia:
    name: Tests du service IA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests (mode TF-IDF, sans télécharger le modèle)
        working-directory: ai-service
        env:
          CV_AI_DISABLE_EMBEDDINGS: "1"
        run: |
          pip install pypdf==5.1.0 pytest
          python -m pytest tests -q

  images:
    name: Image ${{ matrix.service }}
    needs: tests-ia
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
          - service: frontend
            context: frontend
          - service: ai
            context: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Nom de l'image
        id: nom
        env:
          COMPTE: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          COMPTE=$(printf '%s' "${COMPTE:-eniforum}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          echo "image=${COMPTE}/eniforum-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nom.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build et publication
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

# Copiez ce fichier en "secrets.properties" (même dossier) puis remplissez-le.
# secrets.properties est ignoré par git : vos mots de passe ne seront jamais publiés.

# Base de données MySQL
DB_USERNAME=root
DB_PASSWORD=

# Gmail : utilisez un "mot de passe d'application" (compte Google > Sécurité)
MAIL_USERNAME=votre.adresse@gmail.com
MAIL_PASSWORD=xxxxxxxxxxxxxxxx

# Clé JWT (base64, 64 caractères ou plus). Générer : openssl rand -base64 48
# JWT_SECRET=

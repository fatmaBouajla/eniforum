# ===== Secrets locaux (NON versionnés) =====
# Copiez secrets.example.properties en secrets.properties et remplissez-le.
spring.config.import=optional:file:./secrets.properties

# ===== DataSource =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/forum_enicarthage?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# ===== JWT =====
# Valeur par défaut = développement uniquement. En production : variable JWT_SECRET.
app.jwt.secret=${JWT_SECRET:lCogZkUmyco5kMaTYC+CdyJmbEzmWl9Y7k6IKqPf7nA8bcG5l8BnEANFQcmsO35x}
app.jwt.expiration=86400000

# ===== Multipart (upload CV) =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Scheduling =====
spring.task.scheduling.enabled=true

# ===== Microservice analyse CV (Python FastAPI) =====
app.cv-ai.enabled=true
app.cv-ai.base-url=${CV_AI_BASE_URL:http://127.0.0.1:8000}


server.port=8081

spring.jackson.serialization.write-dates-as-timestamps=false



# ===== Mail =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

logging.level.com.enicarthage.forum=INFO
# ===== Premier administrateur (créé au démarrage s'il n'existe aucun admin) =====
app.admin.email=${ADMIN_EMAIL:admin@eniforum.tn}
app.admin.password=${ADMIN_PASSWORD:Admin@2026}
app.admin.nom=${ADMIN_NAME:Administrateur}

# ===== Données de démonstration (comptes, tâches, candidatures) =====
app.demo-data=${DEMO_DATA:false}

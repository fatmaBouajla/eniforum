# Profil d'essai sans MySQL : base en mémoire, effacée à l'arrêt.
# Lancement : mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:eniforum;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
app.demo-data=${DEMO_DATA:true}
